name: CI

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'scripts/package-linux.sh'
      - 'scripts/package-rust.ps1'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'scripts/package-linux.sh'
      - 'scripts/package-rust.ps1'
      - '.github/**'
  workflow_dispatch:
    inputs:
      package_target:
        description: 'Target platform for packaging'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'windows'
          - 'linux'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.0

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy
          rustup override set ${{ env.RUST_VERSION }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked
      - name: Package Linux bundle
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux' && (inputs.package_target == 'all' || inputs.package_target == 'linux')
        run: bash scripts/package-linux.sh
      - name: Upload Linux artifact
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux' && (inputs.package_target == 'all' || inputs.package_target == 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: overmax-linux
          path: |
            dist/overmax-linux-x86_64.tar.gz
            dist/overmax-linux-x86_64.tar.gz.sha256
      - name: Package Windows bundle
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && (inputs.package_target == 'all' || inputs.package_target == 'windows')
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/package-rust.ps1
      - name: Upload Windows artifact
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && (inputs.package_target == 'all' || inputs.package_target == 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: overmax-windows
          path: |
            dist/overmax.zip
            dist/release_manifest.json

  linux-x11-lifecycle:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup override set ${{ env.RUST_VERSION }}
      - name: Install X11 test stack
        run: |
          sudo apt-get update
          sudo apt-get install --yes openbox xauth xvfb
          dpkg-query --show openbox xvfb
      - name: Test X11 tracker and capture lifecycle
        run: bash .github/scripts/linux-vertical-slice-lifecycle.sh
